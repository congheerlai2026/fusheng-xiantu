<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" shape-rendering="crispEdges">
  <!-- 手持灵花 -->
  <rect x="25" y="20" width="1" height="13" fill="#8a6f4a"/>
  <rect x="23" y="15" width="4" height="4" fill="#e88aa8"/>
  <rect x="24" y="16" width="2" height="2" fill="#f6b6cc"/>
  <rect x="23" y="18" width="4" height="1" fill="#c96a8a"/>
  <!-- 披肩长发（后层） -->
  <rect x="9" y="3" width="14" height="15" fill="#3a2f3f"/>
  <!-- 脸 -->
  <rect x="12" y="6" width="8" height="8" fill="#f0d2b0"/>
  <rect x="12" y="6" width="8" height="2" fill="#e0bd96"/>
  <!-- 前帘发 -->
  <rect x="11" y="4" width="10" height="3" fill="#3a2f3f"/>
  <!-- 发饰 -->
  <rect x="12" y="3" width="2" height="2" fill="#e0b64c"/>
  <rect x="18" y="3" width="2" height="2" fill="#e0b64c"/>
  <!-- 眉眼 -->
  <rect x="14" y="9" width="1" height="2" fill="#2b2b33"/>
  <rect x="18" y="9" width="1" height="2" fill="#2b2b33"/>
  <rect x="13" y="12" width="6" height="1" fill="#d9a98a"/>
  <!-- 道袍身（淡紫） -->
  <rect x="9" y="14" width="14" height="28" fill="#7d6f9c"/>
  <rect x="10" y="15" width="12" height="26" fill="#9a8cbb"/>
  <!-- 袖 -->
  <rect x="6" y="15" width="3" height="15" fill="#7d6f9c"/>
  <rect x="23" y="15" width="3" height="15" fill="#7d6f9c"/>
  <rect x="6" y="15" width="3" height="3" fill="#9a8cbb"/>
  <!-- 交领 -->
  <rect x="14" y="14" width="4" height="3" fill="#f0e8f5"/>
  <rect x="15" y="17" width="2" height="9" fill="#f0e8f5"/>
  <!-- 腰带 -->
  <rect x="9" y="28" width="14" height="3" fill="#c89bd6"/>
  <rect x="9" y="29" width="14" height="1" fill="#e0c2ea"/>
  <!-- 腿 -->
  <rect x="11" y="42" width="4" height="5" fill="#5a4f6e"/>
  <rect x="17" y="42" width="4" height="5" fill="#5a4f6e"/>
  <!-- 手 -->
  <rect x="6" y="29" width="3" height="3" fill="#f0d2b0"/>
</svg>
